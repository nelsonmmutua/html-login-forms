<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="html-login-forms project banner">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow" cx="18%" cy="50%" r="35%">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>
  <!-- Glow blob -->
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="300" fill="#1f6feb"/>

  <!-- Shield icon (left) -->
  <g transform="translate(68, 90)">
    <!-- Shield body -->
    <path d="M60 0 L120 22 L120 75 Q120 115 60 135 Q0 115 0 75 L0 22 Z"
          fill="none" stroke="#1f6feb" stroke-width="3" opacity="0.9"/>
    <!-- Shield fill (subtle) -->
    <path d="M60 0 L120 22 L120 75 Q120 115 60 135 Q0 115 0 75 L0 22 Z"
          fill="#1f6feb" opacity="0.08"/>
    <!-- Magnifier inside shield -->
    <circle cx="52" cy="60" r="22" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
    <line x1="68" y1="76" x2="82" y2="90" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
    <!-- HTML brackets inside magnifier -->
    <text x="36" y="67" font-family="monospace" font-size="18" fill="#58a6ff" opacity="0.85">&lt;/&gt;</text>
  </g>

  <!-- Divider line -->
  <line x1="230" y1="70" x2="230" y2="230" stroke="#30363d" stroke-width="1.5"/>

  <!-- Project name -->
  <text x="265" y="140"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace"
        font-size="52" font-weight="700" letter-spacing="-1"
        fill="#e6edf3">html-login-forms</text>

  <!-- Tagline -->
  <text x="267" y="182"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" font-weight="400"
        fill="#8b949e">Phishing login form detection from HTML DOM signatures</text>

  <!-- Tech badges row -->
  <g transform="translate(267, 210)">
    <!-- XGBoost badge -->
    <rect x="0" y="0" width="90" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="45" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#58a6ff">XGBoost</text>

    <!-- Random Forest badge -->
    <rect x="98" y="0" width="122" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="159" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#58a6ff">Random Forest</text>

    <!-- MLflow badge -->
    <rect x="228" y="0" width="72" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="264" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#3fb950">MLflow</text>

    <!-- Python badge -->
    <rect x="308" y="0" width="72" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="344" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#3fb950">Python 3.14</text>

    <!-- CI badge -->
    <rect x="388" y="0" width="80" height="28" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <circle cx="404" cy="14" r="5" fill="#3fb950"/>
    <text x="446" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="500" fill="#8b949e">CI passing</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="296" width="1200" height="4" fill="url(#bg)"/>
  <line x1="265" y1="298" x2="900" y2="298" stroke="#1f6feb" stroke-width="1.5" opacity="0.4"/>
</svg>
