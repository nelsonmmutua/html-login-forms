[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "html-login-forms"
version = "0.1.0"
description = "Structural login-form detection using XGBoost and Random Forest on HTML DOM signatures."
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5,<2",
    "mlflow-skinny>=3.15,<4",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "scikit-learn>=1.8,<2",
    "scipy>=1.17,<2",
    "xgboost>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
train      = "htmlloginforms.train:main"
train-all  = "htmlloginforms.train_all:main"
predict    = "htmlloginforms.predict:main"
retrain    = "htmlloginforms.retrain:main"
evaluate   = "htmlloginforms.evaluate:main"

[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["htmlloginforms"]

[tool.coverage.run]
omit           = ["*/tests/*"]
branch         = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length    = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
